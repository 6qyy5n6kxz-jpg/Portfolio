<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Browse the Wine & Canvas Toledo painting portfolio.">
  <title>Wine & Canvas Toledo Painting Portfolio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="shell hero">
      <div>
        <p class="eyebrow">Wine & Canvas Toledo</p>
        <h1 id="galleryTitle">Painting Portfolio</h1>
        <p id="gallerySubtitle" class="subtitle">Find a painting you love for your next Wine & Canvas experience.</p>
      </div>
      <a class="home-link" href="https://wineandcanvastoledo.com">Wine & Canvas Toledo</a>
    </div>
  </header>

  <main class="shell page">
    <section class="controls" aria-label="Portfolio filters">
      <label class="search-wrap">
        <span>Search paintings</span>
        <input id="searchInput" type="search" placeholder="Pumpkin, beach, flowers…" autocomplete="off">
      </label>
      <label>
        <span>Season</span>
        <select id="seasonFilter"><option value="">All seasons</option></select>
      </label>
      <label>
        <span>Format</span>
        <select id="formatFilter">
          <option value="">All formats</option>
          <option value="16x20">16×20 Canvas</option>
          <option value="11x14">11×14 Canvas</option>
          <option value="8x10">8×10 Canvas</option>
          <option value="wine_glass">Wine Glass</option>
          <option value="wood_pallet">Wood Pallet</option>
          <option value="doormat">Doormat</option>
          <option value="other">Other</option>
        </select>
      </label>
      <label class="checkbox-control">
        <input id="blacklightFilter" type="checkbox">
        <span>Blacklight only</span>
      </label>
      <button id="clearFiltersBtn" type="button" class="secondary-btn">Clear filters</button>
    </section>

    <section class="results-heading">
      <div>
        <p class="eyebrow">Browse the collection</p>
        <h2 id="resultTitle">Paintings</h2>
      </div>
      <p id="resultCount" class="result-count"></p>
    </section>

    <div id="loadingIndicator" class="state-card">Loading paintings…</div>
    <div id="errorMessage" class="state-card error" hidden></div>
    <div id="galleryGrid" class="gallery-grid" aria-live="polite"></div>

    <nav class="pagination" aria-label="Portfolio pages">
      <button id="prevBtn" type="button" class="secondary-btn">← Previous</button>
      <span id="pageInfo"></span>
      <button id="nextBtn" type="button" class="secondary-btn">Next →</button>
    </nav>
  </main>

  <dialog id="paintingDialog" class="painting-dialog">
    <button id="dialogClose" type="button" class="dialog-close" aria-label="Close">×</button>
    <div class="dialog-layout">
      <img id="dialogImage" alt="">
      <div class="dialog-copy">
        <p class="eyebrow">Wine & Canvas Toledo</p>
        <h2 id="dialogTitle"></h2>
        <p id="dialogMeta" class="dialog-meta"></p>
        <p id="dialogDescription"></p>
        <div id="dialogTags" class="tags"></div>
      </div>
    </div>
  </dialog>

  <footer class="site-footer">
    <div class="shell">
      <p>Wine & Canvas Toledo · Browse, choose, and save your favorites for your next event.</p>
    </div>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
